[build-system]
requires = ["setuptools<78.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbench-eval"
version = "0.1.0"
description = "Standalone PaperBench rollout, reproduction, and grading runtime."
requires-python = ">=3.11"
dependencies = [
    "docker>=7.1.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.5",
    "tenacity>=9.0.0",
    "flask>=3.0.3",
    "scikit-learn>=1.5.2",
    "openai>=1.54.3",
    "pandas>=2.0.0",
    "drain3>=0.9.11",
    "blobfile>=3.0.0",
    "tiktoken>=0.9.0",
    "python-dateutil>=2.9.0",
    "unidecode>=1.3.8",
    "structlog>=25.1.0",
    "pymupdf>=1.24.0",
    "chz",
    "nanoeval",
    "nanoeval_alcatraz",
    "alcatraz",
    "preparedness-turn-completer",
    "pandas-stubs>=2.3.0.250703",
]

[tool.setuptools]
packages = { find = { include = ["paperbench", "paperbench.*"] } }

[tool.pyright]
extraPaths = [
    "vendor/alcatraz",
    "vendor/preparedness_turn_completer",
    "vendor/nanoeval",
    "vendor/nanoeval_alcatraz",
]
typeCheckingMode = "off" # we use mypy

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "poethepoet>=0.34.0",
    "pre-commit>=4.2.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-html>=4.1.1",
    "pytest-xdist>=3.6.1",
    "ruff>=0.11.7",
]

[tool.uv.sources]
chz = { git = "https://github.com/openai/chz.git", rev = "b01c082aa50bc8395c1c146138166e19c1b77025" }
nanoeval = { path = "vendor/nanoeval", editable = true }
nanoeval_alcatraz = { path = "vendor/nanoeval_alcatraz", editable = true }
alcatraz = { path = "vendor/alcatraz", editable = true }
preparedness-turn-completer = { path = "vendor/preparedness_turn_completer", editable = true }

[tool.ruff]
extend-exclude = ["paperbench/solvers/aisi-basic-agent/"]
target-version = "py311"
line-length = 100

[tool.mypy]
strict = true
local_partial_types = true
# These two make life easier if you use a lot of untyped libraries:
warn_return_any = false
allow_untyped_calls = true
# Do not use `ignore_missing_imports`, instead use:
disable_error_code = ["import-untyped"]
# If you don't want to force use of type annotations:
# allow_incomplete_defs = true
# allow_untyped_defs = true
# allow_any_generics = true
exclude = "^(paperbench/solvers/aisi-basic-agent|tests/integration/runs)(/|$)"
mypy_path = ["vendor/alcatraz", "vendor/preparedness_turn_completer", "vendor/nanoeval", "vendor/nanoeval_alcatraz"]
[[tool.mypy.overrides]]
module = [
    "alcatraz.*",
    "preparedness_turn_completer.*",
    "nanoeval.*",
    "nanoeval_alcatraz.*",
]
ignore_errors = true
warn_unused_ignores = false

[tool.pylint]
disable = ["all"]
# will eventually be supported by ruff: github.com/astral-sh/ruff/issues/2914
enable = ["cyclic-import"]
ignore-paths = [
    "^paperbench/solvers/aisi-basic-agent(/|$)",
    "^tests/integration/runs(/|$)",
]

[tool.poe.tasks]
lint = "ruff check --fix"
typecheck = "mypy paperbench tests"
